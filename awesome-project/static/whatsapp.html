<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conversations</title>
<style>
  :root {
    --bg: #0b141a;
    --panel: #111b21;
    --border: #222d34;
    --text: #e9edef;
    --muted: #8696a0;
    --accent: #00a884;
    --bubble-in: #202c33;
    --bubble-out: #005c4b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; }

  #sidebar { width: 320px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #sidebar h2 { padding: 16px; margin: 0; font-size: 16px; border-bottom: 1px solid var(--border); }
  #conv-list { flex: 1; overflow-y: auto; }
  .conv-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .conv-item:hover, .conv-item.active { background: var(--panel); }
  .conv-phone { font-size: 14px; font-weight: 600; }
  .conv-preview { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  #chat { flex: 1; display: flex; flex-direction: column; }
  #chat-header { padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 600; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
  .bubble { max-width: 60%; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
  .bubble.in { align-self: flex-start; background: var(--bubble-in); }
  .bubble.out { align-self: flex-end; background: var(--bubble-out); }
  .bubble-time { font-size: 10px; color: var(--muted); margin-top: 4px; }

  #chat-input { display: flex; padding: 12px; border-top: 1px solid var(--border); gap: 10px; }
  #chat-input input { flex: 1; padding: 10px 14px; border-radius: 20px; border: none; background: var(--panel); color: var(--text); font-size: 14px; outline: none; }
  #chat-input button { background: var(--accent); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; color: white; font-size: 16px; }

  #empty { margin: auto; color: var(--muted); }
</style>
</head>
<body>

<div id="sidebar">
  <h2>Conversations</h2>
  <div id="conv-list"></div>
</div>

<div id="chat">
  <div id="chat-header">Select a conversation</div>
  <div id="chat-messages"><div id="empty">No conversation selected</div></div>
  <div id="chat-input" style="display:none;">
    <input id="msg-input" placeholder="Type a message" />
    <button id="send-btn">➤</button>
  </div>
</div>

<script>
let activePhone = null;

function fmtTime(ts) {
  return new Date(ts + 'Z').toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}

async function loadConversations() {
  const res = await fetch('/conversations');
  const data = await res.json();
  const list = document.getElementById('conv-list');
  list.innerHTML = '';
  data.forEach(c => {
    const item = document.createElement('div');
    item.className = 'conv-item' + (c.phone === activePhone ? ' active' : '');
    item.innerHTML = `<div class="conv-phone">${c.phone}</div><div class="conv-preview">${c.text}</div>`;
    item.onclick = () => openConversation(c.phone);
    list.appendChild(item);
  });
}

async function openConversation(phone) {
  activePhone = phone;
  document.getElementById('chat-header').textContent = phone;
  document.getElementById('chat-input').style.display = 'flex';
  await loadMessages();
  loadConversations();
}

async function loadMessages() {
  if (!activePhone) return;
  const res = await fetch(`/conversations/${activePhone}`);
  const data = await res.json();
  const box = document.getElementById('chat-messages');
  box.innerHTML = '';
  data.forEach(m => {
    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + m.direction;
    bubble.innerHTML = m.text + `<div class="bubble-time">${fmtTime(m.timestamp)}</div>`;
    box.appendChild(bubble);
  });
  box.scrollTop = box.scrollHeight;
}

async function sendMsg() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !activePhone) return;
  input.value = '';
  await fetch(`/conversations/${activePhone}/send`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text})
  });
  loadMessages();
}

document.getElementById('send-btn').onclick = sendMsg;
document.getElementById('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMsg();
});

loadConversations();
setInterval(() => { loadConversations(); if (activePhone) loadMessages(); }, 3000);
</script>

</body>
</html>
