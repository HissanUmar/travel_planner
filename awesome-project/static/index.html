<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat</title>
<style>
  :root {
    --bg: #16181d;
    --panel: #1d2027;
    --border: #2a2e37;
    --text: #e8e6e0;
    --muted: #8b8f9a;
    --accent: #5eb8a3;
    --user-bubble: #2a2e37;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Söhne', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
  }

  #history-panel {
    width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    overflow-y: auto;
    flex-shrink: 0;
  }

  #history-panel h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 14px;
    letter-spacing: 0.02em;
  }

  .history-item {
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: default;
  }

  .history-item:hover {
    background: var(--border);
    color: var(--text);
  }

  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .msg {
    display: flex;
    flex-direction: column;
    max-width: 78%;
    line-height: 1.5;
    font-size: 15px;
  }

  .msg.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .msg.bot {
    align-self: flex-start;
    align-items: flex-start;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 12px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    color: var(--text);
    border-bottom-right-radius: 3px;
  }

  .msg.bot .bubble {
    background: transparent;
    color: var(--text);
    padding-left: 0;
  }

  .label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    padding: 0 2px;
  }

  #empty-state {
    margin: auto;
    text-align: center;
    color: var(--muted);
  }

  #empty-state h1 {
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }

  #empty-state p {
    font-size: 14px;
  }

  #input-area {
    padding: 16px 24px 24px;
    border-top: 1px solid var(--border);
  }

  #input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 10px 10px 16px;
  }

  #text-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    resize: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    line-height: 1.4;
    max-height: 160px;
  }

  #text-input::placeholder { color: var(--muted); }

  #send-btn {
    background: var(--accent);
    border: none;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s;
  }

  #send-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  #send-btn svg { width: 16px; height: 16px; }

  .typing {
    display: flex;
    gap: 4px;
    padding: 6px 2px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }

  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  @media (max-width: 640px) {
    #history-panel { display: none; }
  }
</style>
</head>
<body>

<div id="history-panel">
  <h2>History</h2>
  <div id="history-list"></div>
</div>

<div id="main">
  <div id="messages">
    <div id="empty-state">
      <h1>What do you want to know?</h1>
      <p>Ask anything — I'll remember the conversation.</p>
    </div>
  </div>

  <div id="input-area">
    <div id="input-row">
      <textarea id="text-input" rows="1" placeholder="Message..."></textarea>
      <button id="send-btn" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="#16181d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('text-input');
const sendBtn = document.getElementById('send-btn');
const historyList = document.getElementById('history-list');
const emptyState = document.getElementById('empty-state');

function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
}
inputEl.addEventListener('input', autoGrow);

function extractText(response) {
  if (typeof response === 'string') return response;
  return response.text || response.message || response.response || JSON.stringify(response);
}

function addMessage(role, text) {
  emptyState.remove();
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = role === 'user' ? 'You' : 'Assistant';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg bot';
  wrap.id = 'typing-indicator';
  wrap.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  autoGrow();
  sendBtn.disabled = true;
  addMessage('user', text);
  addTyping();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    removeTyping();
    addMessage('bot', extractText(data));
  } catch (err) {
    removeTyping();
    addMessage('bot', 'Something went wrong reaching the server.');
  } finally {
    sendBtn.disabled = false;
    loadHistory();
  }
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

async function loadHistory() {
  try {
    const res = await fetch('/history');
    const data = await res.json();
    historyList.innerHTML = '';
    data.slice(0, 20).forEach(h => {
      const item = document.createElement('div');
      item.className = 'history-item';
      item.textContent = h.user_message;
      historyList.appendChild(item);
    });
  } catch (err) { /* history unavailable */ }
}
loadHistory();
</script>

</body>
</html>
