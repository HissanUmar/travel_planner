<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mechanic Dashboard</title>
<style>
  :root { --bg: #16181d; --panel: #1d2027; --border: #2a2e37; --text: #e8e6e0; --muted: #8b8f9a; --accent: #5eb8a3; --warn: #d9a441; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text); font-family: sans-serif; }

  #sidebar { width: 300px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
  #sidebar-header h2 { margin: 0 0 10px; font-size: 16px; }
  #new-request-row { display: flex; gap: 6px; }
  #phone-input { flex: 1; padding: 8px; border-radius: 6px; border: none; background: var(--panel); color: var(--text); font-size: 12px; }
  #new-btn { background: var(--accent); border: none; border-radius: 6px; padding: 0 12px; cursor: pointer; font-weight: 600; }

  #request-list { flex: 1; overflow-y: auto; }
  .req-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; position: relative; }
  .req-item:hover, .req-item.active { background: var(--panel); }
  .req-title { font-size: 14px; font-weight: 600; }
  .req-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); position: absolute; right: 14px; top: 16px; }

  #chat { flex: 1; display: flex; flex-direction: column; }
  #chat-header { padding: 14px 20px; border-bottom: 1px solid var(--border); font-weight: 600; }
  #chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 65%; padding: 9px 13px; border-radius: 10px; font-size: 14px; white-space: pre-wrap; line-height: 1.4; }
  .bubble.mechanic { align-self: flex-end; background: #2a2e37; }
  .bubble.llm { align-self: flex-start; background: #1d2027; }
  .bubble.update { align-self: center; background: #143d33; color: #8fe0c8; font-size: 13px; }

  .question-card { align-self: center; background: #3a2f14; color: #f0d090; border-radius: 10px; padding: 12px; max-width: 80%; }
  .question-card .q-actions { margin-top: 8px; display: flex; gap: 6px; }
  .question-card input { flex: 1; padding: 6px; border-radius: 6px; border: none; background: var(--bg); color: var(--text); font-size: 12px; }
  .question-card button { border: none; border-radius: 6px; padding: 0 10px; cursor: pointer; font-size: 12px; background: var(--warn); font-weight: 600; }

  .alt-card { align-self: center; background: #1a2e3a; color: #90c8f0; border-radius: 10px; padding: 12px; max-width: 80%; }
  .alt-card .alt-actions { margin-top: 8px; display: flex; gap: 6px; }
  .alt-card button { border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
  .btn-pursue { background: var(--accent); font-weight: 600; }
  .btn-decline { background: #2a2e37; color: var(--text); }

  #chat-input-row { display: flex; padding: 12px; border-top: 1px solid var(--border); gap: 8px; }
  #chat-input-row input { flex: 1; padding: 10px; border-radius: 8px; border: none; background: var(--panel); color: var(--text); }
  #chat-input-row button { background: var(--accent); border: none; border-radius: 8px; padding: 0 18px; cursor: pointer; font-weight: 600; }
  #input-mode-label { font-size: 11px; color: var(--muted); padding: 0 12px; }

  #empty-chat { margin: auto; color: var(--muted); }
  .waiting-note { text-align: center; color: var(--muted); font-size: 13px; padding: 10px; }

  .offers-panel { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; }
  .offers-heading { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .offer-card { background: var(--panel); border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .offer-status { font-size: 13px; }
  .offer-actions { margin-top: 8px; display: flex; gap: 6px; }
  .offer-actions input { flex: 1; padding: 6px; border-radius: 6px; border: none; background: var(--bg); color: var(--text); font-size: 12px; }
  .offer-actions button { border: none; border-radius: 6px; padding: 0 10px; cursor: pointer; font-size: 12px; }
  .btn-negotiate { background: #2a2e37; color: var(--text); }
  .btn-confirm { background: var(--accent); font-weight: 600; }
  .btn-chat { background: #2a2e37; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  .btn-chat:hover { background: #353a45; }

  .thread-chat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-top: 10px;
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .thread-bubble {
    max-width: 80%;
    padding: 7px 11px;
    border-radius: 8px;
    font-size: 13px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .thread-bubble.dealer {
    align-self: flex-start;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .thread-bubble.llm, .thread-bubble.mechanic {
    align-self: flex-end;
    background: #23374d;
    color: #a5d8ff;
  }

  .top-actions { display: flex; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--border); }
  .top-actions button { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
</style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h2>My Requests</h2>
    <div id="new-request-row">
      <input id="phone-input" placeholder="Your phone (e.g. 923...)" value="923004499554">
      <button id="new-btn" onclick="startNewRequest()">+ New</button>
    </div>
  </div>
  <div id="request-list"></div>
</div>

<div id="chat">
  <div id="chat-header">Select a request</div>
  <div id="top-actions" class="top-actions" style="display:none;">
    <button onclick="pingDealers()">Any update?</button>
    <button onclick="cancelRequest()">Cancel request</button>
  </div>
  <div id="chat-messages"><div id="empty-chat">No request selected</div></div>
  <div id="chat-input-row" style="display:none;">
    <input id="msg-input" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
let activeRequestId = null;
let knownUnread = {};
const openThreadChats = new Set();

if ("Notification" in window && Notification.permission === "default") {
  Notification.requestPermission();
}

function requestTitle(req) {
  if (req.part_name && req.car_model) return `${req.car_model} — ${req.part_name}`;
  if (req.part_name) return req.part_name;
  return `New request #${req.id}`;
}

function requestSubtitle(req) {
  const statusLabels = {
    COLLECTING_INFO: "In progress",
    AWAITING_CONFIRMATION: "Awaiting your confirmation",
    BROADCASTING: "Checking with dealers",
    REPORT_READY: "Offers ready",
    TICKET_CREATED: "Ticket created",
    CANCELLED: "Cancelled"
  };
  return statusLabels[req.status] || req.status;
}

async function loadRequests() {
  const phone = document.getElementById('phone-input').value.trim();
  if (!phone) return;
  const res = await fetch(`/mechanic-requests?phone=${phone}`);
  const requests = await res.json();

  const list = document.getElementById('request-list');
  list.innerHTML = '';

  requests.forEach(req => {
    const item = document.createElement('div');
    item.className = 'req-item' + (req.id === activeRequestId ? ' active' : '');
    item.innerHTML = `
      <div class="req-title">${requestTitle(req)}</div>
      <div class="req-sub">${requestSubtitle(req)}</div>
      ${req.has_unread ? '<div class="unread-dot"></div>' : ''}
    `;
    item.onclick = () => openRequest(req.id);
    list.appendChild(item);

    if (req.has_unread && !knownUnread[req.id]) {
      knownUnread[req.id] = true;
      if (document.hidden && Notification.permission === "granted") {
        new Notification("Update on " + requestTitle(req), { body: "Tap to view" });
      }
    }
    if (!req.has_unread) knownUnread[req.id] = false;
  });
}

function renderBubble(m) {
  if (m.type === 'dealer_question') {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.innerHTML = `
      <div>${m.text}</div>
      <div class="q-actions">
        <input id="answer-${m.thread_id}" placeholder="Your answer...">
        <button onclick="answerDealerQuestion(${m.thread_id})">Send</button>
      </div>
    `;
    return card;
  }

  if (m.type === 'alternative_offer') {
    const card = document.createElement('div');
    card.className = 'alt-card';
    card.innerHTML = `
      <div>${m.text}</div>
      <div class="alt-actions">
        <button class="btn-pursue" onclick="pursueAlternative(${m.thread_id})">Ask for details</button>
        <button class="btn-decline" onclick="declineAlternative(${m.thread_id})">Not interested</button>
      </div>
    `;
    return card;
  }

  const bubble = document.createElement('div');
  const isUpdate = m.type === 'update' || (m.role === 'llm' && m.text.startsWith('Update:'));
  bubble.className = 'bubble ' + (isUpdate ? 'update' : (m.role === 'mechanic' ? 'mechanic' : 'llm'));
  bubble.textContent = m.text;
  return bubble;
}

async function openRequest(id, isPoll = false) {
  if (activeRequestId !== id) {
    openThreadChats.clear();
  }
  activeRequestId = id;

  if (!isPoll) {
    await fetch(`/mechanic-requests/${id}/mark-read`, { method: 'POST' });
  }

  const res = await fetch(`/mechanic-requests/${id}`);
  const req = await res.json();

  document.getElementById('chat-header').textContent = requestTitle(req);

  const box = document.getElementById('chat-messages');
  const prevScrollTop = box.scrollTop;
  const wasNearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 60;

  box.innerHTML = '';
  req.conversation.forEach(m => box.appendChild(renderBubble(m)));

  const editable = ['COLLECTING_INFO', 'AWAITING_CONFIRMATION'].includes(req.status);
  const canAsk = ['BROADCASTING', 'REPORT_READY'].includes(req.status);

  document.getElementById('chat-input-row').style.display = (editable || canAsk) ? 'flex' : 'none';
  document.getElementById('msg-input').placeholder = editable ? 'Type a message...' : 'Ask a question about this request...';
  document.getElementById('top-actions').style.display = canAsk ? 'flex' : 'none';

  if (req.status === 'BROADCASTING') {
    const note = document.createElement('div');
    note.className = 'waiting-note';
    note.textContent = 'Waiting on dealer replies — updates will appear here automatically.';
    box.appendChild(note);
  }

  if (['BROADCASTING', 'REPORT_READY', 'TICKET_CREATED'].includes(req.status)) {
    await renderOffers(id);
  }

  if (!isPoll || wasNearBottom) {
    box.scrollTop = box.scrollHeight;
  } else {
    box.scrollTop = prevScrollTop;
  }

  loadRequests();
}

async function renderOffers(requestId) {
  const res = await fetch(`/dealer-threads/${requestId}`);
  const threads = await res.json();
  const box = document.getElementById('chat-messages');

  const panel = document.createElement('div');
  panel.className = 'offers-panel';

  const heading = document.createElement('div');
  heading.className = 'offers-heading';
  heading.textContent = 'Dealer offers';
  panel.appendChild(heading);

  if (threads.length === 0) {
    const none = document.createElement('div');
    none.className = 'waiting-note';
    none.textContent = 'No dealers contacted yet.';
    panel.appendChild(none);
  }

  threads.forEach(t => {
      const card = document.createElement('div');
      card.className = 'offer-card';

      let statusLine, actionsHtml = '';
      const canChat = !['REJECTED', 'CLOSED', 'NO_RESPONSE'].includes(t.status);
      const unreadBadge = t.has_unread ? ' <span style="color:var(--warn);">●</span>' : '';
      const isOpen = openThreadChats.has(t.id);

      if (t.status === 'REJECTED') {
        statusLine = `<b>${t.shop_name}</b> — Unavailable`;
      } else if (t.status === 'CLOSED') {
        statusLine = `<b>${t.shop_name}</b> — Declined (another dealer chosen)`;
      } else if (t.status === 'NO_RESPONSE') {
        statusLine = `<b>${t.shop_name}</b> — No response`;
      } else if (t.status === 'AWAITING_MECHANIC_INPUT') {
        statusLine = `<b>${t.shop_name}</b>${unreadBadge} — Waiting on your answer`;
      } else if (t.status === 'SELECTED') {
        statusLine = `<b>${t.shop_name}</b>${unreadBadge} — PKR ${t.price} (${t.is_genuine === 'True' ? 'genuine' : 'aftermarket'}) — ✅ Confirmed`;
      } else if (t.price) {
        statusLine = `<b>${t.shop_name}</b>${unreadBadge} — PKR ${t.price} (${t.is_genuine === 'True' ? 'genuine' : 'aftermarket'})`;
      } else {
        statusLine = `<b>${t.shop_name}</b>${unreadBadge} — Waiting for response...`;
      }

      if (canChat) {
        const showConfirm = t.price && t.status !== 'SELECTED';
        actionsHtml = `
          <div class="offer-actions">
            <button class="btn-chat" id="btn-chat-${t.id}" onclick="toggleThreadChat(${t.id})">${isOpen ? 'Close Chat' : 'Chat'}${unreadBadge}</button>
            ${showConfirm ? `<button class="btn-confirm" onclick="confirmOffer(${t.id})">Confirm</button>` : ''}
          </div>
          <div id="thread-chat-${t.id}" style="${isOpen ? 'display:block;' : 'display:none;'}"></div>
        `;
      }

      card.innerHTML = `<div class="offer-status">${statusLine}</div>${actionsHtml}`;
      panel.appendChild(card);
  });

  box.appendChild(panel);

  const openThreads = threads.filter(t => openThreadChats.has(t.id) && !['REJECTED', 'CLOSED', 'NO_RESPONSE'].includes(t.status));
  if (openThreads.length > 0) {
    await Promise.all(openThreads.map(t => loadThreadChat(t.id)));
  }
}

async function answerDealerQuestion(threadId) {
  const input = document.getElementById(`answer-${threadId}`);
  const text = input.value.trim();
  if (!text) return;
  const phone = document.getElementById('phone-input').value.trim();
  await fetch('/mechanic-message', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone, text })
  });
  openRequest(activeRequestId);
}

async function pursueAlternative(threadId) {
  await fetch(`/dealer-threads/${threadId}/pursue-alternative`, { method: 'POST' });
  openRequest(activeRequestId);
}

async function declineAlternative(threadId) {
  await fetch(`/dealer-threads/${threadId}/decline-alternative`, { method: 'POST' });
  openRequest(activeRequestId);
}

async function negotiate(threadId) {
  return sendThreadMessage(threadId);
}

async function confirmOffer(threadId) {
  if (!confirm('Confirm this offer? This will decline other dealers for this request.')) return;
  await fetch(`/dealer-threads/${threadId}/confirm`, { method: 'POST' });
  openRequest(activeRequestId);
}

async function pingDealers() {
  const res = await fetch(`/mechanic-requests/${activeRequestId}/ping-dealers`, { method: 'POST' });
  const data = await res.json();
  alert(`Pinged ${data.count} dealer(s)`);
  openRequest(activeRequestId);
}

async function cancelRequest() {
  if (!confirm('Cancel this request?')) return;
  await fetch(`/mechanic-requests/${activeRequestId}/cancel`, { method: 'POST' });
  openRequest(activeRequestId);
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  const phone = document.getElementById('phone-input').value.trim();
  if (!text || !phone) return;

  input.value = '';

  await fetch('/mechanic-message', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone, text })
  });

  const res = await fetch(`/mechanic-requests?phone=${phone}`);
  const requests = await res.json();
  if (requests.length) {
    const stillSameOrNewer = activeRequestId && requests.find(r => r.id === activeRequestId);
    activeRequestId = stillSameOrNewer ? activeRequestId : requests[0].id;
    openRequest(activeRequestId);
  }
}

async function toggleThreadChat(threadId) {
  const container = document.getElementById(`thread-chat-${threadId}`);
  const btn = document.getElementById(`btn-chat-${threadId}`);

  if (openThreadChats.has(threadId)) {
    openThreadChats.delete(threadId);
    if (container) {
      container.style.display = 'none';
      container.innerHTML = '';
    }
    if (btn) {
      btn.textContent = 'Chat';
    }
    return;
  }

  openThreadChats.add(threadId);
  if (btn) {
    btn.textContent = 'Close Chat';
  }
  if (container) {
    container.style.display = 'block';
    container.innerHTML = '<div style="color:var(--muted); font-size:12px; padding:8px;">Loading chat...</div>';
  }
  await loadThreadChat(threadId);
}

async function loadThreadChat(threadId) {
  const container = document.getElementById(`thread-chat-${threadId}`);
  if (!container) return;

  const existingInput = document.getElementById(`chat-input-${threadId}`);
  const draftText = existingInput ? existingInput.value : '';
  const wasFocused = (document.activeElement === existingInput);
  const selectionStart = existingInput ? existingInput.selectionStart : null;
  const selectionEnd = existingInput ? existingInput.selectionEnd : null;

  try {
    await fetch(`/dealer-threads/${threadId}/mark-read`, { method: 'POST' });
    const res = await fetch(`/dealer-threads/thread/${threadId}`);
    if (!res.ok) return;
    const thread = await res.json();

    const chatBox = document.createElement('div');
    chatBox.className = 'thread-chat';
    if (!thread.conversation || thread.conversation.length === 0) {
      const emptyNote = document.createElement('div');
      emptyNote.style.color = 'var(--muted)';
      emptyNote.style.fontSize = '12px';
      emptyNote.style.padding = '6px';
      emptyNote.textContent = 'No messages in this chat yet.';
      chatBox.appendChild(emptyNote);
    } else {
      thread.conversation.forEach(m => {
        const b = document.createElement('div');
        b.className = 'thread-bubble ' + (m.role === 'dealer' ? 'dealer' : 'llm');
        b.textContent = m.text;
        chatBox.appendChild(b);
      });
    }

    const inputRow = document.createElement('div');
    inputRow.className = 'offer-actions';

    const input = document.createElement('input');
    input.id = `chat-input-${threadId}`;
    input.placeholder = 'Message this dealer...';
    input.value = draftText;
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        sendThreadMessage(threadId);
      }
    });

    const sendBtn = document.createElement('button');
    sendBtn.className = 'btn-negotiate';
    sendBtn.textContent = 'Send';
    sendBtn.onclick = () => sendThreadMessage(threadId);

    inputRow.appendChild(input);
    inputRow.appendChild(sendBtn);

    container.innerHTML = '';
    container.appendChild(chatBox);
    container.appendChild(inputRow);
    container.style.display = 'block';
    chatBox.scrollTop = chatBox.scrollHeight;

    if (wasFocused) {
      input.focus();
      if (selectionStart !== null && selectionEnd !== null) {
        input.setSelectionRange(selectionStart, selectionEnd);
      }
    }
  } catch (err) {
    console.error('Error loading thread chat', err);
  }
}

async function sendThreadMessage(threadId) {
  const input = document.getElementById(`chat-input-${threadId}`);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  try {
    await fetch(`/dealer-threads/${threadId}/negotiate`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
  } catch (err) {
    console.error('Failed to send message to dealer', err);
  }

  await loadThreadChat(threadId);
  loadRequests();
}

function startNewRequest() {
  activeRequestId = null;
  document.getElementById('chat-header').textContent = 'New request';
  document.getElementById('top-actions').style.display = 'none';
  document.getElementById('chat-messages').innerHTML = '<div id="empty-chat">Type your first message below to start</div>';
  document.getElementById('chat-input-row').style.display = 'flex';
  document.getElementById('msg-input').placeholder = 'Type a message...';
}

document.getElementById('msg-input')?.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});

loadRequests();
setInterval(() => {
  const active = document.activeElement;
  const isTyping = active && (
    active.id === 'msg-input' ||
    (active.id && (
      active.id.startsWith('chat-input-') ||
      active.id.startsWith('neg-') ||
      active.id.startsWith('answer-')
    ))
  );
  loadRequests();
  if (activeRequestId && !isTyping) {
    openRequest(activeRequestId, true);
  }
}, 4000);
</script>

</body>
</html>
